name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install required SDK platform/build-tools
        run: |
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        id: build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/gradle-build.log

      - name: Check APK was produced
        id: check_apk
        run: |
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Report diagnostics as issue
        if: steps.build.outcome == 'failure' || steps.check_apk.outputs.found == 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "### gradle outcome: ${{ steps.build.outcome }}"
            echo "### apk found: ${{ steps.check_apk.outputs.found }}"
            echo '### find app/build/outputs'
            echo '```'
            find app/build/outputs -type f 2>&1 || echo "no outputs dir"
            echo '```'
            echo '### gradle log tail'
            echo '```'
            tail -c 50000 /tmp/gradle-build.log
            echo '```'
          } > /tmp/issue-body.md
          gh issue create \
            --title "Build diagnostics: run ${{ github.run_id }}" \
            --body-file /tmp/issue-body.md
          exit 1

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ninebot-control-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
